name: Validate wiki
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Validate all Markdown
        run: python tools/validate_wiki.py --json > validation.json
      - name: Check atlas extensions and regression tests when present
        run: |
          if [ -f tools/atlas.py ]; then
            python tools/atlas.py check --json > atlas-validation.json
            python tools/atlas.py catalog > atlas-catalog.json
            python tools/atlas.py progress > atlas-progress.json
            python tools/atlas.py timeline > atlas-timeline.json
            python tools/atlas.py source-audit > atlas-source-audit.json
          fi
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi
      - name: Check edition 1.6 research hygiene
        run: python tools/research_quality.py --json > research-quality.json
      - name: Check edition 1.7 research hygiene
        run: python tools/research_quality.py --edition 1.7 --json > research-quality-1-7.json
      - name: Check edition 1.8 research hygiene
        run: python tools/research_quality.py --edition 1.8 --json > research-quality-1-8.json
      - name: Check edition 1.9 research hygiene
        run: python tools/research_quality.py --edition 1.9 --json > research-quality-1-9.json
      - name: Check complete generated subject directory
        run: python tools/build_subject_index.py --check
      - name: Build portable snapshot of tracked files
        if: always()
        run: |
          python - <<'PY'
          import subprocess
          import zipfile
          from pathlib import Path
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('wiki-snapshot.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(filter(None, paths)):
                  path = Path(name)
                  if path.is_file():
                      archive.write(path, name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-validation
          path: |
            validation.json
            atlas-validation.json
            atlas-catalog.json
            atlas-progress.json
            atlas-timeline.json
            atlas-source-audit.json
            research-quality.json
            research-quality-1-7.json
            research-quality-1-8.json
            research-quality-1-9.json
            wiki-snapshot.zip
          if-no-files-found: error
          retention-days: 14
